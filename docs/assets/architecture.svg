<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <defs>
    <linearGradient id="slackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#611f69"/>
      <stop offset="100%" style="stop-color:#e01e5a"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#94a3b8" font-size="11">MCP SLACK SERVER — ARCHITECTURE</text>

  <!-- AI Clients (left) -->
  <rect x="30" y="60" width="180" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="120" y="82" text-anchor="middle" fill="#94a3b8" font-size="10">MCP CLIENTS</text>
  <rect x="45" y="95" width="150" height="28" rx="4" fill="#334155"/>
  <text x="120" y="114" text-anchor="middle" fill="#f1f5f9" font-size="11">Claude / Kiro</text>
  <rect x="45" y="130" width="150" height="28" rx="4" fill="#334155"/>
  <text x="120" y="149" text-anchor="middle" fill="#f1f5f9" font-size="11">Cursor / Codex</text>
  <rect x="45" y="165" width="150" height="28" rx="4" fill="#334155"/>
  <text x="120" y="184" text-anchor="middle" fill="#f1f5f9" font-size="11">Windsurf / Open Code</text>
  <rect x="45" y="200" width="150" height="28" rx="4" fill="#334155"/>
  <text x="120" y="219" text-anchor="middle" fill="#f1f5f9" font-size="11">Any MCP Client</text>

  <!-- Arrow: Clients → Server -->
  <line x1="210" y1="150" x2="280" y2="150" stroke="#6366f1" stroke-width="2"/>
  <polygon points="280,145 290,150 280,155" fill="#6366f1"/>
  <text x="250" y="140" text-anchor="middle" fill="#6366f1" font-size="9">JSON-RPC</text>
  <text x="250" y="162" text-anchor="middle" fill="#6366f1" font-size="9">stdio</text>

  <!-- MCP Server (center) -->
  <rect x="290" y="50" width="280" height="260" rx="8" fill="url(#mcpGrad)" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="430" y="72" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">mcp-slack (Rust)</text>

  <!-- Server internals -->
  <rect x="305" y="85" width="250" height="35" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="0.5"/>
  <text x="430" y="107" text-anchor="middle" fill="#f1f5f9" font-size="11">rmcp 1.7 — #[tool_router] (27 tools)</text>

  <rect x="305" y="128" width="120" height="30" rx="4" fill="#1e293b"/>
  <text x="365" y="147" text-anchor="middle" fill="#fbbf24" font-size="10">HealthCheck</text>

  <rect x="435" y="128" width="120" height="30" rx="4" fill="#1e293b"/>
  <text x="495" y="147" text-anchor="middle" fill="#fbbf24" font-size="10">mcp-server.toml</text>

  <!-- Tool categories -->
  <rect x="305" y="168" width="75" height="50" rx="4" fill="#1e293b"/>
  <text x="342" y="186" text-anchor="middle" fill="#38bdf8" font-size="9">CHANNELS</text>
  <text x="342" y="200" text-anchor="middle" fill="#64748b" font-size="8">list, create</text>
  <text x="342" y="212" text-anchor="middle" fill="#64748b" font-size="8">members, topic</text>

  <rect x="385" y="168" width="75" height="50" rx="4" fill="#1e293b"/>
  <text x="422" y="186" text-anchor="middle" fill="#38bdf8" font-size="9">MESSAGES</text>
  <text x="422" y="200" text-anchor="middle" fill="#64748b" font-size="8">send, search</text>
  <text x="422" y="212" text-anchor="middle" fill="#64748b" font-size="8">threads, DMs</text>

  <rect x="465" y="168" width="75" height="50" rx="4" fill="#1e293b"/>
  <text x="502" y="186" text-anchor="middle" fill="#38bdf8" font-size="9">FILES</text>
  <text x="502" y="200" text-anchor="middle" fill="#64748b" font-size="8">upload, read</text>
  <text x="502" y="212" text-anchor="middle" fill="#64748b" font-size="8">list</text>

  <rect x="305" y="225" width="75" height="50" rx="4" fill="#1e293b"/>
  <text x="342" y="243" text-anchor="middle" fill="#a78bfa" font-size="9">CANVASES</text>
  <text x="342" y="257" text-anchor="middle" fill="#64748b" font-size="8">create, read</text>
  <text x="342" y="269" text-anchor="middle" fill="#64748b" font-size="8">update</text>

  <rect x="385" y="225" width="75" height="50" rx="4" fill="#1e293b"/>
  <text x="422" y="243" text-anchor="middle" fill="#a78bfa" font-size="9">SCHEDULE</text>
  <text x="422" y="257" text-anchor="middle" fill="#64748b" font-size="8">draft, send</text>
  <text x="422" y="269" text-anchor="middle" fill="#64748b" font-size="8">delete</text>

  <rect x="465" y="225" width="75" height="50" rx="4" fill="#1e293b"/>
  <text x="502" y="243" text-anchor="middle" fill="#a78bfa" font-size="9">MORE</text>
  <text x="502" y="257" text-anchor="middle" fill="#64748b" font-size="8">bookmarks</text>
  <text x="502" y="269" text-anchor="middle" fill="#64748b" font-size="8">emoji, users</text>

  <rect x="305" y="282" width="250" height="20" rx="4" fill="#1e293b"/>
  <text x="430" y="296" text-anchor="middle" fill="#94a3b8" font-size="9">tracing · env-filter · adk-mcp-sdk</text>

  <!-- Arrow: Server → Slack -->
  <line x1="570" y1="150" x2="640" y2="150" stroke="#e01e5a" stroke-width="2"/>
  <polygon points="640,145 650,150 640,155" fill="#e01e5a"/>
  <text x="605" y="140" text-anchor="middle" fill="#e01e5a" font-size="9">HTTPS</text>
  <text x="605" y="162" text-anchor="middle" fill="#e01e5a" font-size="9">Bearer token</text>

  <!-- Slack API (right) -->
  <rect x="650" y="60" width="220" height="250" rx="8" fill="url(#slackGrad)" opacity="0.15" stroke="#e01e5a" stroke-width="1.5"/>
  <text x="760" y="82" text-anchor="middle" fill="#e01e5a" font-size="12" font-weight="bold">Slack Web API</text>

  <rect x="665" y="95" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="112" text-anchor="middle" fill="#f1f5f9" font-size="10">conversations.*</text>
  <rect x="665" y="125" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="142" text-anchor="middle" fill="#f1f5f9" font-size="10">chat.postMessage / schedule</text>
  <rect x="665" y="155" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="172" text-anchor="middle" fill="#f1f5f9" font-size="10">search.messages</text>
  <rect x="665" y="185" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="202" text-anchor="middle" fill="#f1f5f9" font-size="10">files.* / canvases.*</text>
  <rect x="665" y="215" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="232" text-anchor="middle" fill="#f1f5f9" font-size="10">users.* / reactions.*</text>
  <rect x="665" y="245" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="262" text-anchor="middle" fill="#f1f5f9" font-size="10">bookmarks.* / emoji.*</text>
  <rect x="665" y="275" width="190" height="24" rx="4" fill="#1e293b"/>
  <text x="760" y="292" text-anchor="middle" fill="#f1f5f9" font-size="10">api.slack.com/api/*</text>

  <!-- Registry (bottom) -->
  <rect x="290" y="330" width="280" height="45" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="430" y="350" text-anchor="middle" fill="#6366f1" font-size="10">ADK-RUST ENTERPRISE REGISTRY</text>
  <text x="430" y="366" text-anchor="middle" fill="#64748b" font-size="9">auto-onboarding · health monitoring · risk governance</text>

  <!-- Arrow: Server → Registry -->
  <line x1="430" y1="310" x2="430" y2="330" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Footer -->
  <text x="450" y="420" text-anchor="middle" fill="#475569" font-size="10">mcp-slack v1.2.0 · 27 tools · reqwest + serde · Bot Token (xoxb-)</text>
</svg>
