server_id = "mcp_slack"
display_name = "Slack"
version = "1.3.0"
domain = "collaboration"
sdk_version = "0.2.0"
risk_level = "high"
writes_allowed = "gated"
transports = ["stdio"]
credentials = ["vault://slack-bot-token"]
governance_gates = ["mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "list_channels"
description = "List Slack channels (public and private) the bot has access to"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "get_channel_history"
description = "Get recent messages from a channel"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "send_message"
description = "Send a message to a Slack channel or thread"
risk_class = "external_write"
requires_approval = true
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "add_reaction"
description = "Add an emoji reaction to a message"
risk_class = "external_write"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "search_messages"
description = "Search messages across all channels"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "list_users"
description = "List workspace users"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "set_channel_topic"
description = "Set a channel's topic"
risk_class = "external_write"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "upload_file"
description = "Upload a text file to a channel"
risk_class = "external_write"
requires_approval = true
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "get_user"
description = "Get user profile info by user ID"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://slack-bot-token"]

[[tools]]
name = "get_thread"
description = "Get thread replies for a message"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_dms"
description = "List direct message conversations"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "open_dm"
description = "Open or get a DM conversation with one or more users (comma-separated user IDs)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_channel"
description = "Create a new channel"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_members"
description = "List members of a channel (returns user IDs)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_canvas"
description = "Create a canvas (rich document) and share it in a channel"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_emoji"
description = "List custom emoji in the workspace"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_file"
description = "Get file metadata and download URL by file ID"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_files"
description = "List files shared in a channel or workspace"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "read_canvas"
description = "Read a canvas (export as markdown)"
risk_class = "read_only"
requires_approval = false
